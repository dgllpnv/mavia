# A Mavia em produção — pendência 1D.
#
# ## Por que containers avulsos, e não um stack do EasyPanel
#
# A VPS roda vinte e quatro containers de produção de outros negócios, em Docker
# Swarm, orquestrados pelo EasyPanel. A Mavia entra **ao lado**, como containers
# comuns, e não dentro daquela orquestração. Três razões, em ordem de peso:
#
# 1. **Um erro aqui não pode alcançar o que já está lá.** O painel controla
#    Chatwoot, Evolution API e três bancos de clientes; mexer na configuração
#    dele para acomodar a Mavia é aceitar esse risco sem precisar.
# 2. **Duas peças da nossa arquitetura não cabem no modelo de app do EasyPanel.**
#    O `parser` precisa de `network_mode: none` e o `guardião` precisa de `stdin`
#    interativo para o desselamento manual.
# 3. `docker compose down` desfaz tudo. Um stack meio-criado no painel, não.
#
# O Traefik do EasyPanel tem o provider Docker ligado (`TRAEFIK_PROVIDERS_DOCKER
# =true`), então ele descobre estes containers por **label** — sem que a gente
# escreva no arquivo que o painel gera e sobrescreve.
#
# ## O que encara a internet
#
# Só o `web`. A API **não é publicada**: o navegador chama `/api/...` na origem
# do web, e o servidor do Next repassa pela rede interna. É a mesma topologia do
# ambiente local, e é o que faz o cookie de sessão funcionar sem CORS.
#
# Nenhum serviço publica porta no host. A regra 47xx-em-127.0.0.1 do ambiente
# local existe para não expor banco na rede do escritório; aqui a resposta é
# mais forte — não há porta publicada nenhuma.

name: mavia

services:
  # -------------------------------------------------------------------------
  # Postgres — o banco da Mavia, e só dela
  # -------------------------------------------------------------------------
  # **Instância própria, e não a `auri_lumina-postgres` que já está na máquina.**
  # As migrations criam papéis (`mavia_migrate`, `mavia_app`, `mavia_auth`,
  # `mavia_jobs`), tornam `mavia_migrate` dono do esquema `public` e ligam RLS.
  # Instalar isso no cluster de outro produto seria sujar o banco alheio com a
  # topologia de papéis do nosso.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mavia
      POSTGRES_PASSWORD: ${SENHA_POSTGRES:?defina SENHA_POSTGRES}
      POSTGRES_DB: mavia
      # UTC no banco, sempre. A conversão para `America/Sao_Paulo` é do
      # domínio — `CLAUDE.md` regra 7.
      TZ: UTC
      PGTZ: UTC
      SENHA_MIGRATE: ${SENHA_MIGRATE:?defina SENHA_MIGRATE}
      SENHA_APP: ${SENHA_APP:?defina SENHA_APP}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      # Roda uma vez, na criação do volume. Ver `10-papeis.sh`.
      - ./10-papeis.sh:/docker-entrypoint-initdb.d/10-papeis.sh:ro
    networks: [dados]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mavia -d mavia']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------------
  # Redis — cofre do access token e fila do BullMQ
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly`: perder o Redis não desloga ninguém — os clientes renovam
    # pelo refresh, que vive no Postgres. Mas perder a fila do BullMQ perderia
    # jobs de materialização de recorrência, e esses não se recuperam sozinhos.
    #
    # `requirepass` porque **quem alcança este Redis sem senha é qualquer
    # usuário**: o access token vive aqui como JSON, e escrever um `usuario_id`
    # à mão vale por um login. A rede `dados` é interna, mas ela não é o
    # perímetro — a API está nela, e uma requisição forjada de dentro da API
    # (SSRF) chega aqui sem sair do host. Uma senha transforma "estar na rede"
    # em "ter a credencial".
    # O arquivo, e **não** `--requirepass` na linha de comando: ali a senha
    # aparece em `docker inspect` e na lista de processos do namespace. O
    # arquivo é renderizado pelo `implantar.sh` a partir de `redis.conf.modelo`,
    # e traz junto a ACL dos cinco prefixos em uso (condição C-7).
    command: ['redis-server', '/etc/redis/redis.conf']
    environment:
      # O `redis-cli` lê esta variável sozinho. É o que faz o healthcheck
      # autenticar sem repetir a senha na linha de comando dele — e sem ela o
      # `ping` responde NOAUTH e o container nunca fica saudável.
      REDISCLI_AUTH: ${SENHA_REDIS:?defina SENHA_REDIS}
    volumes:
      - redis-dados:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    networks: [dados]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  # -------------------------------------------------------------------------
  # API
  # -------------------------------------------------------------------------
  api:
    image: mavia/api:${VERSAO:-mais-recente}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mavia_app:${SENHA_APP:?}@postgres:5432/mavia

      # As duas pools do painel de administração — ADR 0024 D3.
      #
      # **Vazias por padrão, e ligar o painel é preenchê-las.** `main.ts` sobe
      # dizendo "painel de administração desligado" quando faltam, que é a
      # resposta certa para uma instalação que não o quer. Quem as escreve é
      # `./provisionar-painel.sh`, junto com a senha dos dois papéis.
      #
      # São **duas** e não uma porque `mavia_admin` não é membro de
      # `mavia_admin_escrita`: a separação é por autenticação, não por
      # instrução. Uma conexão só, que trocasse de papel com `SET ROLE`, seria
      # reversível com `RESET ROLE` dentro da mesma transação — e a leitura
      # viraria escrita sem que nada além da disciplina impedisse.
      DATABASE_URL_PAINEL: ${DATABASE_URL_PAINEL:-}
      DATABASE_URL_PAINEL_ESCRITA: ${DATABASE_URL_PAINEL_ESCRITA:-}
      REDIS_URL: redis://:${SENHA_REDIS:?defina SENHA_REDIS}@redis:6379
      MAVIA_PEPPER_TENTATIVAS: ${PEPPER_TENTATIVAS:?defina PEPPER_TENTATIVAS}
      MAVIA_URL_PUBLICA: ${URL_PUBLICA:?defina URL_PUBLICA}
      # Sem SMTP, cadastro e recuperação respondem 503 em vez de fingir. Sem
      # `GOOGLE_*`, a entrada pelo Google responde 503 e a tela diz para usar
      # e-mail e senha. Os dois são estados legítimos — ver P-3 e P-4.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${URL_PUBLICA}/entrar/google

      # Stripe — épico 11. Vazias por enquanto, e é assim que tem de ser: a
      # `cobranca.controller` recusa o webhook com 400 quando não há segredo,
      # em vez de aceitar qualquer corpo assinado por ninguém.
      #
      # O endpoint a cadastrar no painel da Stripe é
      # `${URL_PUBLICA}/v1/cobranca/webhook`.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Sem `MAVIA_GUARDIAO_SOCKET`: não há agregador bancário ligado, e o
      # guardião só é necessário quando houver (ADR 0003). Toda operação sobre
      # segredo de conexão lança `GuardiaoIndisponivel` — que é a verdade.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # `dados` para alcançar Postgres e Redis; `saida` para alcançar o mundo.
    #
    # A API **precisa** de saída para a internet, e essa é a lição que quase
    # virou defeito: com uma rede só, marcada `internal`, o SMTP do cadastro e a
    # troca de código do Google falhariam em produção — e as duas só falham no
    # primeiro cadastro de um cliente, não no deploy.
    networks: [dados, saida]
    # O parser é filho deste processo, com `env: {}` e prazo duro. O isolamento
    # de rede e o cgroup dele são a metade que ainda falta da P-12 — ver o
    # `README.md` desta pasta.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4711/v1/eu').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s

  # -------------------------------------------------------------------------
  # Web — o único que o Traefik alcança
  # -------------------------------------------------------------------------
  web:
    image: mavia/web:${VERSAO:-mais-recente}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    networks: [dados, easypanel]
    labels:
      traefik.enable: 'true'
      # `easypanel` e não `interna`: sem isto o Traefik pode escolher o IP da
      # rede errada e falhar em alcançar o container, com um 502 que não explica
      # nada.
      traefik.docker.network: easypanel

      # -----------------------------------------------------------------------
      # O produto — tudo que **não** é o painel
      # -----------------------------------------------------------------------
      # A negação não é estilo: é o que faz a allowlist do painel **falhar
      # fechada**. Sem ela, os dois roteadores se sobrepõem e o do produto casa
      # `/admin` também; no dia em que o middleware não puder ser construído —
      # `IPS_DO_PAINEL` vazia, um CIDR com erro de digitação — o Traefik
      # **descarta o roteador do painel** em vez de bloquear, e o produto passa
      # a servir `/admin` sem allowlist nenhuma. O controle não falharia
      # fechado: ele sumiria, em silêncio, com uma linha de log num Traefik que
      # não é nosso.
      #
      # E o gatilho mais provável desse erro de digitação é justamente o
      # procedimento de recuperação de lockout, executado por uma pessoa só,
      # sob pressão, por SSH.
      #
      # Com as regras **disjuntas**, se o painel cai ninguém o serve: 404.
      # Disjunção também torna `priority` desnecessária — não há empate a
      # desempatar, e uma label a menos é um acoplamento a menos.
      traefik.http.routers.mavia.rule: 'Host(`${DOMINIO:?defina DOMINIO}`) && !PathRegexp(`(?i)(^|/)admin(/|$)`)'
      traefik.http.routers.mavia.entrypoints: https
      traefik.http.routers.mavia.tls: 'true'
      # Explícito nos três roteadores, embora o Traefik resolva sozinho hoje: a
      # dedução por serviço único **só vale enquanto o serviço for único**. No
      # dia em que este container declarar um segundo `loadbalancer.server.port`,
      # todo roteador sem `service` é removido da configuração — inclusive o do
      # produto, e o site inteiro sai do ar por uma label que ninguém ligou ao
      # sintoma.
      traefik.http.routers.mavia.service: mavia
      traefik.http.services.mavia.loadbalancer.server.port: '4710'

      # -----------------------------------------------------------------------
      # O painel — atrás da allowlist de IP (C-6a)
      # -----------------------------------------------------------------------
      # A contrapartida que o gate de segurança pediu ao aceitar o adiamento do
      # MFA. Ver `docs/superpowers/specs/2026-09-05-allowlist-de-ip-do-painel.md`.
      #
      # ## Por que a regra é "um segmento chamado `admin`", e não um prefixo
      #
      # O caminho óbvio — `PathPrefix('/admin') || PathPrefix('/api/v1/admin')` —
      # **é contornável, e foi contornado contra esta produção antes de existir
      # allowlist**. Duas assimetrias entre o Traefik e o Next se somam:
      #
      # 1. `PathPrefix` do Traefik é sensível à caixa; o rewrite do Next não é
      #    (`caseSensitive: false` no `routes-manifest.json`). `/API/v1/admin/eu`
      #    não casa a regra e ainda assim alcança o controlador — 401 medido.
      # 2. O Traefik casa o caminho **cru**; quem normaliza `//`, `/./` e
      #    `/x/../` é o servidor do Next. `/api//v1/admin/eu` também mediu 401.
      #
      # Enumerar grafias num prefixo é jogo perdido — some sempre uma. Casar
      # **um segmento igual a `admin`** é imune às duas: qualquer grafia que o
      # Next normalize para uma rota de painel tem esse segmento, em qualquer
      # caixa e sob qualquer ruído de barra.
      #
      # O excesso é deliberado e é para o lado seguro: bloqueia também
      # `/_next/static/chunks/app/admin/*`, que hoje anuncia a forma do painel a
      # quem quiser ler. Nenhuma rota de produto tem segmento `admin` — as de
      # topo são `cartoes, categorias, contas, convite, importar, lancamentos,
      # membros, objetivos, plano, planejamento, relatorios` —, e os segmentos
      # variáveis são UUID ou token, que não são a palavra `admin`.
      traefik.http.routers.mavia-painel.rule: 'Host(`${DOMINIO}`) && PathRegexp(`(?i)(^|/)admin(/|$)`)'
      # Explícito: um roteador sem `entrypoints` liga-se a **todas** as entradas,
      # e o painel passaria a ser servido em texto claro no `http` em vez de
      # redirecionado.
      traefik.http.routers.mavia-painel.entrypoints: https
      traefik.http.routers.mavia-painel.tls: 'true'
      traefik.http.routers.mavia-painel.service: mavia
      traefik.http.routers.mavia-painel.middlewares: mavia-ips-do-painel

      # `sourcerange` e **nada mais**. Sem `ipstrategy`, sem `depth`, sem
      # `excludedips` — e isto é a decisão de segurança desta seção, não estilo.
      #
      # A estratégia padrão compara contra o endereço do **socket**, que não se
      # forja. Qualquer `ipstrategy` faria o middleware ler o `X-Forwarded-For`
      # — e a entrada HTTPS deste Traefik roda com
      # `TRAEFIK_ENTRYPOINTS_HTTPS_FORWARDEDHEADERS_INSECURE=true`, o que
      # significa que o cabeçalho **vem do cliente**. Uma allowlist que lê um
      # cabeçalho que o atacante escreve atravessa-se com uma linha de `curl`.
      #
      # ⚠️ **Invariante do primeiro salto.** Isto só é válido enquanto o Traefik
      # for o primeiro salto TCP — hoje é: as portas 80 e 443 são publicadas em
      # `PublishMode: host`, verificado no serviço Swarm `easypanel-traefik`.
      # Um CDN ou proxy à frente faz o `RemoteAddr` virar o do CDN e a allowlist
      # **falha aberta, sem mudar de cor**. Domínio próprio e CDN chegam no
      # mesmo dia; item obrigatório de conferência na C-6b.
      #
      # `:-` e não `-`: com `:-`, variável ausente **e** vazia caem no padrão
      # fechado. Com `-`, a string vazia sobrescreveria o padrão, o middleware
      # não se construiria, e cairíamos no modo de falha que a negação do
      # roteador do produto existe para conter.
      traefik.http.middlewares.mavia-ips-do-painel.ipallowlist.sourcerange: '${IPS_DO_PAINEL:-127.0.0.1/32}'

      # HTTP existe só para mandar embora. O cookie de sessão tem prefixo
      # `__Host-`, que obriga `Secure` — em `http://` o navegador o descarta e
      # ninguém consegue ficar logado. Servir a Mavia sem TLS não é degradação:
      # é o login não funcionar.
      # **Ele cobre `/admin` por redirecionar tudo**, e é por isso que o painel
      # não precisa de um par em `http`: um `GET http://.../admin` de origem não
      # permitida leva 301 antes de qualquer coisa alcançar a aplicação, refaz
      # em HTTPS e aí encontra a allowlist. Um segundo roteador aqui só trocaria
      # o 301 por 403, sem ganho, e criaria uma segunda lista de caminhos para
      # manter em sincronia com a de cima.
      #
      # Se um dia esta entrada passar a **servir** algo em vez de redirecionar,
      # o painel fica descoberto nela. Esta é a linha que precisa disparar o
      # alarme nesse dia.
      traefik.http.routers.mavia-http.rule: Host(`${DOMINIO}`)
      traefik.http.routers.mavia-http.entrypoints: http
      traefik.http.routers.mavia-http.service: mavia
      # `@file` porque o middleware é definido pelo provider de arquivo do
      # EasyPanel, e este router vem do provider Docker. Sem o sufixo, o Traefik
      # procura um middleware do próprio provider e não encontra.
      traefik.http.routers.mavia-http.middlewares: redirect-to-https@file

networks:
  # Onde os dados vivem. **Sem saída para a internet**, e é o ponto: um Postgres
  # comprometido não tem por onde exfiltrar. Postgres, Redis, API e web
  # conversam aqui.
  dados:
    driver: bridge
    internal: true

  # A saída, e **só a API a tem**. É ela que fala com o SMTP e com o Google.
  # Postgres e Redis ficam de fora de propósito: eles não precisam alcançar nada
  # lá fora, e um banco sem rota de saída é um banco que não vaza sozinho.
  #
  # Sem porta publicada, uma bridge comum não é alcançável **de fora** do host —
  # ela dá saída, não entrada.
  saida:
    driver: bridge

  # A rede do EasyPanel, onde o Traefik vive. `external` porque ela já existe e
  # **não é nossa** — declarar sem isso faria o compose tentar criá-la.
  easypanel:
    external: true

volumes:
  postgres-dados:
  redis-dados:
